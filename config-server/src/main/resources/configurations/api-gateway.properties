spring.application.name=api-gateway
server.port=8080

# 1. Connexion à Eureka
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

# 2. Configuration globale de la Gateway
spring.cloud.gateway.discovery.locator.enabled=true

# 3. Route pour Microservice User Management (Index 0)
spring.cloud.gateway.routes[0].id=user-management-service
spring.cloud.gateway.routes[0].uri=lb://USER-MANAGEMENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# 4. Route pour Microservice Task Management (Index 1)
spring.cloud.gateway.routes[1].id=task-management-service
spring.cloud.gateway.routes[1].uri=lb://TASK-MANAGEMENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tasks/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# 5. Route pour Microservice Weather Intelligence (Index 2)
spring.cloud.gateway.routes[2].id=weather-intelligence-service
spring.cloud.gateway.routes[2].uri=lb://WEATHER-INTELLIGENCE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/weather/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# 6. Route pour Microservice Analytics (Index 3) - MISE À JOUR
spring.cloud.gateway.routes[3].id=analytics-service
spring.cloud.gateway.routes[3].uri=lb://ANALYTICS-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/analytics/**
# Indispensable pour que le service reçoive le token JWT et puisse appeler Task Service
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

# api-gateway.properties
spring.cloud.gateway.routes[4].id=report-service
spring.cloud.gateway.routes[4].uri=lb://report-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/report-service/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1