# Base de données
# Utilisation de variables d'environnement avec valeurs par défaut pour la portabilité
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/irrigo_farm_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
# Permet au service de s'enregistrer dynamiquement
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

# Paramètres du Service
server.port=8087

# Sécurité & JWT
# La clé doit rester identique à celle du task-management-service
jwt.secret=votre_cle_tres_secrete_pour_irrigo_ezzayra_solutions_2026_mihoub_ayoub
jwt.expiration=86400000

# Configuration Feign (pour appeler le Task Service)
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# Logging
logging.level.com.irrigo.farmtaskservice=DEBUG