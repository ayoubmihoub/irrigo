server.port=8083
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/weather_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# Clés API (Remplacez par vos vraies clés)
openweather.api.key=${api.openweather.key}
api.gemini.key=${api.gemini.key}

# Eureka
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true