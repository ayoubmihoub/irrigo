# 1. Le nom de l'application (doit correspondre EXACTEMENT au nom du fichier dans le config-server)
spring.application.name=farm-task-service

# 2. Importer la configuration depuis le Config Server (obligatoire en Spring Boot 3/4)
spring.config.import=optional:configserver:http://localhost:8888

# 3. Optionnel : Pour voir les logs détaillés si la connexion échoue
logging.level.org.springframework.cloud.config=DEBUG